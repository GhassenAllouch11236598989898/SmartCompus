# SmartCampus AI — base PostgreSQL (pgvector) + API FastAPI.
# Lancement : cp .env.example .env  puis  docker compose up -d --build
name: smartcampus

services:
  postgres:
    image: pgvector/pgvector:${POSTGRES_IMAGE_TAG:-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-smartcampus_test}
      SMARTCAMPUS_OWNER_PASSWORD: ${SMARTCAMPUS_OWNER_PASSWORD:?voir .env.example}
      SMARTCAMPUS_APP_PASSWORD: ${SMARTCAMPUS_APP_PASSWORD:?voir .env.example}
      AI_READONLY_PASSWORD: ${AI_READONLY_PASSWORD:?voir .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 5432/5433 souvent déjà pris en local : port hôte configurable.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://smartcampus_app:${SMARTCAMPUS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartcampus}
      MIGRATION_DATABASE_URL: postgresql+psycopg://smartcampus_owner:${SMARTCAMPUS_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartcampus}
      AI_READONLY_DATABASE_URL: postgresql+psycopg://ai_readonly:${AI_READONLY_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartcampus}
      # Utilisés par les tests lancés dans le conteneur (docker compose exec api pytest).
      TEST_DATABASE_URL: postgresql+psycopg://smartcampus_app:${SMARTCAMPUS_APP_PASSWORD}@postgres:5432/${POSTGRES_TEST_DB:-smartcampus_test}
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://smartcampus_owner:${SMARTCAMPUS_OWNER_PASSWORD}@postgres:5432/${POSTGRES_TEST_DB:-smartcampus_test}
      TEST_AI_READONLY_DATABASE_URL: postgresql+psycopg://ai_readonly:${AI_READONLY_PASSWORD}@postgres:5432/${POSTGRES_TEST_DB:-smartcampus_test}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?voir .env.example}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      # LLM (SA-30) : par défaut Ollama lancé sur la machine hôte.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      LLM_MEMORY_MAX_MESSAGES: ${LLM_MEMORY_MAX_MESSAGES:-12}
      LLM_MEMORY_EXTRACTION: ${LLM_MEMORY_EXTRACTION:-regles}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
